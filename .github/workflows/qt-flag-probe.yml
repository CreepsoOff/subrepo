name: Qt flag probe (c++23 + -no-emojisegmenter)

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create/update a release tag 'qt-flag-probe' and upload report asset"
        type: boolean
        default: false
      min_version:
        description: "Minimum Qt minor series to test (e.g. '6.9'). Leave empty to test ALL Qt 6.x versions."
        type: string
        default: "6.9"

jobs:
  list-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Qt 6.x versions
        id: list
        shell: pwsh
        run: |
          $minVer = "${{ inputs.min_version }}"
          if ($minVer -ne "") {
            ./scripts/list-qt6-versions.ps1 -MinVersion $minVer -OutFile qt6-versions.json
          } else {
            ./scripts/list-qt6-versions.ps1 -OutFile qt6-versions.json
          }
          $json = (Get-Content qt6-versions.json -Raw).Trim()
          "versions=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  probe:
    needs: list-versions
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        qt: ${{ fromJSON(needs.list-versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@v4

      - name: Probe Qt flags
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          ./scripts/probe-qt.ps1 -QtVersion "${{ matrix.qt }}" -OutDir "out"

      - name: Upload per-version report
        uses: actions/upload-artifact@v4
        with:
          name: qt-probe-${{ matrix.qt }}
          path: out/

  merge-report:
    runs-on: ubuntu-latest
    needs: probe
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qt-probe-*
          merge-multiple: true
          path: reports

      - name: Build merged markdown
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Qt flag probe results"
            echo ""
            echo "Criteria: must support **-no-emojisegmenter** and **-c++std c++23** (no fallback, no workaround)."
            echo ""
            echo "## Per-version results"
            echo ""
            if compgen -G "reports/*.md" > /dev/null; then
              for f in reports/*.md; do
                cat "$f"
                echo ""
              done
            else
              echo "_No per-version markdown found._"
            fi
          } > qt-flag-probe-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: qt-flag-probe-report
          path: qt-flag-probe-report.md

      - name: Create/Update release and upload asset
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qt-flag-probe
          name: "Qt flag probe"
          body_path: qt-flag-probe-report.md
          files: qt-flag-probe-report.md
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
